AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sahayak Emergency Response Platform Infrastructure

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    Timeout: 15
    Environment:
      Variables:
        INCIDENTS_TABLE: !Ref IncidentsTable
        RESOURCES_TABLE: !Ref ResourcesTable

Resources:
  # 1. DynamoDB Tables
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: sahayak-incidents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ResourcesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: sahayak-resources
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # 2. Cognito User Pool
  SahayakUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: SahayakUsers
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8

  # Cognito Groups for RBAC
  CitizenGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: CITIZEN
      UserPoolId: !Ref SahayakUserPool

  OperatorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: OPERATOR
      UserPoolId: !Ref SahayakUserPool

  ResponderGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: RESPONDER
      UserPoolId: !Ref SahayakUserPool

  # 3. API Gateway
  SahayakApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: api
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt SahayakUserPool.Arn

  # 4. Lambda Functions
  CreateEmergencyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../
      Handler: services/api/src/handlers/createEmergency.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ResourcesTable
        - Statement:
            - Effect: Allow
              Action: 'bedrock:InvokeModel'
              Resource: 'arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0'
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref SahayakApi
            Path: /emergency
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - services/api/src/handlers/createEmergency.ts

  GetEmergenciesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../
      Handler: services/api/src/handlers/getEmergencies.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref SahayakApi
            Path: /emergency
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - services/api/src/handlers/getEmergencies.ts

  GetEmergencyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../
      Handler: services/api/src/handlers/getEmergency.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref SahayakApi
            Path: /emergency/{id}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - services/api/src/handlers/getEmergency.ts

  AssignEmergencyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../
      Handler: services/api/src/handlers/assignEmergency.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ResourcesTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref SahayakApi
            Path: /emergency/{id}/assign
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - services/api/src/handlers/assignEmergency.ts

  UpdateEmergencyStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../
      Handler: services/api/src/handlers/updateEmergencyStatus.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ResourcesTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref SahayakApi
            Path: /emergency/{id}/status
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - services/api/src/handlers/updateEmergencyStatus.ts

  GetResourcesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../
      Handler: services/api/src/handlers/getResources.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ResourcesTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref SahayakApi
            Path: /resources
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - services/api/src/handlers/getResources.ts

  CreateResourceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../
      Handler: services/api/src/handlers/createResource.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResourcesTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref SahayakApi
            Path: /resources
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - services/api/src/handlers/createResource.ts

  UpdateResourceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../
      Handler: services/api/src/handlers/updateResource.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResourcesTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref SahayakApi
            Path: /resources/{id}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - services/api/src/handlers/updateResource.ts

Outputs:
  ApiUrl:
    Value: !Sub "https://${SahayakApi}.execute-api.${AWS::Region}.amazonaws.com/api/"
  IncidentsTableName:
    Value: !Ref IncidentsTable
  ResourcesTableName:
    Value: !Ref ResourcesTable
  UserPoolId:
    Value: !Ref SahayakUserPool
